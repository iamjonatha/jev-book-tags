name: Suggest a feature
description: Tell us what would make book tagging easier.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your current library workflow and where it gets difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should the plugin help? Examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
